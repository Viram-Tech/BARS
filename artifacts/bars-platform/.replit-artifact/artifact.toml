kind = "web"
previewPath = "/"
title = "BARS Road Safety Platform"
description = "A national road-safety knowledge and collaboration platform connecting evidence, data, people, and institutions across Sarkaar, Bazaar, and Samaaj."
version = "1.0.0"
id = "artifacts/bars-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22798

[services.development]
run = "pnpm --filter @workspace/bars-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bars-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/bars-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22798"
BASE_PATH = "/"
