openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: languages
    description: Indic language support
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /languages:
    get:
      operationId: listIndicLanguages
      tags: [languages]
      summary: List the supported Indic languages
      description: Returns the 22 constitutionally scheduled languages supported by the BARS language layer.
      responses:
        "200":
          description: Supported Indic languages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicLanguageList"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    IndicLanguage:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        nativeName:
          type: string
        script:
          type: string
      required: [code, name, nativeName, script]
    IndicLanguageList:
      type: object
      properties:
        region:
          type: string
        count:
          type: integer
        languages:
          type: array
          items:
            $ref: "#/components/schemas/IndicLanguage"
      required: [region, count, languages]

